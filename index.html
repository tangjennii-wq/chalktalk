*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:#f8f7fa;color:#2d2a3e;min-height:100vh}
.app{max-width:780px;margin:0 auto;padding:24px 16px 60px}
button{cursor:pointer;font-family:inherit}
textarea,input[type=text]{font-family:inherit}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:16px;height:16px;border:2.5px solid #e2dfe8;border-top-color:#702b9d;border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:middle}
/* Citations */
.cite{display:inline-block;background:#eee6f3;color:#702b9d;padding:1px 5px;border-radius:4px;font-size:10px;font-weight:600;margin:0 1px;cursor:pointer;vertical-align:super;line-height:1.4;text-decoration:none;border:1px solid #d4baea;transition:all .12s ease;font-family:ui-sans-serif,system-ui,sans-serif}
.cite:hover{background:#702b9d;color:#fff;border-color:#702b9d}
.cite-pop{position:absolute;background:#fff;border:1px solid #d4baea;border-radius:10px;padding:14px 16px;max-width:320px;min-width:240px;box-shadow:0 8px 28px rgba(45,42,62,0.18);z-index:1000;font-size:13px;line-height:1.5;color:#2d2a3e}
.cite-pop-title{font-weight:700;color:#330662;margin-bottom:4px;line-height:1.3}
.cite-pop-meta{font-size:11px;color:#9490a6;margin-bottom:8px;text-transform:uppercase;letter-spacing:0.05em}
.cite-pop-link{display:inline-block;font-size:12px;color:#702b9d;text-decoration:none;border-bottom:1px solid #d4baea;font-weight:500}
.cite-pop-link:hover{color:#330662;border-bottom-color:#702b9d}
.cite-pop-close{position:absolute;top:6px;right:8px;background:none;border:none;color:#9490a6;font-size:16px;cursor:pointer;line-height:1;padding:2px 6px;border-radius:4px}
.cite-pop-close:hover{background:#f0eef4;color:#330662}
@media (max-width:600px){.cite-pop{max-width:90vw;min-width:auto}}

/* Mobile-compact overrides — applied at narrow widths */
@media (max-width: 640px) {
  .app { padding: 12px 10px 32px !important; max-width: 100% !important; }
  /* Header: very compact on mobile, title above buttons row */
  [data-mhdr] { padding: 12px 14px !important; gap: 8px !important; flex-wrap: wrap !important; flex-direction: column !important; align-items: stretch !important; border-radius: 12px !important; }
  [data-mhdr-title] { font-size: 18px !important; line-height: 1.05 !important; white-space: nowrap !important; }
  [data-mhdr-sub] { font-size: 9.5px !important; line-height: 1.3 !important; margin: 1px 0 0 !important; white-space: normal !important; }
  /* Description footer-style: tiny single line */
  [data-mdesc] { font-size: 10.5px !important; margin: -2px 0 10px !important; padding: 0 6px !important; line-height: 1.4 !important; }
  /* Examples gallery: 2-up tighter on mobile */
  [data-msample-grid] { grid-template-columns: 1fr 1fr !important; gap: 5px !important; }
  [data-msample-grid] button { padding: 7px 9px !important; min-height: 56px !important; }
  [data-msample-grid] button > span:first-child { font-size: 11px !important; line-height: 1.2 !important; }
  /* Topic card */
  [data-mtopic] { padding: 10px 12px !important; margin-bottom: 10px !important; border-radius: 10px !important; }
  [data-mtopic] textarea { font-size: 13px !important; padding: 8px 10px !important; }
  /* Generate button */
  [data-mgen] { padding: 12px !important; font-size: 14px !important; }
}

      {name:"AASLD Cirrhosis & Ascites 2021/2024",year:2024,access:"Open",url:"https://www.aasld.org/practice-guidelines",keys:"Variceal bleed: octreotide + ceftriaxone (SBP prophylaxis) + EVL. Ascites: spironolactone + furosemide; refractory -> TIPS or LVP + albumin. HRS-AKI: terlipressin + albumin (CONFIRM, 36% reversal vs placebo). HE: lactulose +/- rifaximin."},

      {name:"AASLD HBV 2018 + updates",year:2018,access:"Open",url:"https://www.aasld.org/",keys:"Treat HBeAg+ with HBV DNA >20,000 + ALT >2x ULN; or HBeAg- with HBV DNA >2,000. Tenofovir / entecavir first-line. Universal screening (anti-HBs, anti-HBc, HBsAg) per CDC 2023."},

  "Endocrinology": {
    society: "ADA, Endocrine Society, AACE, ATA",
    guidelines: [
      {name:"ADA Standards of Care 2025",year:2025,access:"Open",url:"https://professional.diabetes.org/standards-of-care",keys:"Metformin baseline + early combination. SGLT2i for ASCVD/HF/CKD regardless of A1c (EMPA-REG, CANVAS, DAPA-HF). GLP-1 RA for ASCVD/obesity (LEADER, REWIND, SUSTAIN-6, SELECT). Tirzepatide for weight loss (SURMOUNT). CGM for non-insulin T2DM."},
      {name:"Endocrine Society Hypopituitarism 2016",year:2016,access:"Open",url:"https://academic.oup.com/jcem/article/101/11/3888/2764912",keys:"8-9am cortisol <3 = adrenal insufficiency; 3-15 ambiguous (cosyntropin stim or insulin tolerance test). Hydrocortisone 15-25 mg/day in divided doses; stress dosing for illness/surgery. Levothyroxine, sex hormones, GH per deficiency."},
      {name:"Endocrine Society Cushing 2015",year:2015,access:"Open",url:"https://academic.oup.com/jcem/article/100/8/2807/2836065",keys:"Screening: 24h urine free cortisol, late-night salivary cortisol, or 1-mg dexamethasone suppression. Treatment: transsphenoidal selective adenomectomy first-line (Cushing disease); unilateral adrenalectomy for adrenal adenoma. Ketoconazole/metyrapone/osilodrostat second-line."},
      {name:"Endocrine Society Primary Aldosteronism 2016",year:2016,access:"Open",url:"https://pubmed.ncbi.nlm.nih.gov/26934393/",keys:"Screen if SBP >150 / resistant HTN / hypokalemia / adrenal incidentaloma / OSA / family history. Aldosterone-renin ratio (ARR) initial test. Confirm with saline infusion or oral salt load. Adrenal vein sampling if surgery considered. Lateralization -> adrenalectomy; bilateral -> spironolactone."},
      {name:"ATA Thyroid Nodules 2015",year:2015,access:"Open",url:"https://www.thyroid.org/professionals/ata-professional-guidelines/",keys:"US risk stratification (TI-RADS-like): high suspicion -> FNA at >=1cm; intermediate -> 1-1.5cm; low -> 1.5cm; very low -> 2cm. Bethesda categories for FNA. Active surveillance for low-risk PTC <1cm."},
      {name:"AACE/ATA Hypothyroidism 2014/2024",year:2024,access:"Open",url:"https://www.endocrinepractice.org/",keys:"TSH screening; treat if TSH >10 or symptoms with TSH 4.5-10. Levothyroxine 1.6 mcg/kg/day; titrate by TSH. Liothyronine combination not routinely recommended. Subclinical hypothyroidism treatment individualized."},
      {name:"AACE Postmenopausal Osteoporosis 2020",year:2020,access:"Open",url:"https://pro.aace.com/clinical-guidance/2020-clinical-practice-guidelines-diagnosis-and-treatment-postmenopausal",keys:"T-score <=-2.5 diagnostic. First-line: alendronate, risedronate, zoledronate, denosumab. Anabolics (teriparatide, abaloparatide, romosozumab) for very-high-risk. FRAX >=20% major or 3% hip fracture risk treatment threshold."},
      {name:"KDIGO 2022 Diabetes in CKD",year:2022,access:"Open",url:"https://kdigo.org/guidelines/diabetes-ckd/",keys:"SGLT2i for T2DM + CKD regardless A1c (eGFR >=20). Metformin if eGFR >=30. GLP-1 RA semaglutide for kidney protection (FLOW). Finerenone if eGFR >25, K normal, ACR >30 (FIDELIO/FIGARO)."},

  "ID": {
    society: "IDSA, SCCM, CDC, ACIP",
    guidelines: [
      {name:"Surviving Sepsis Campaign 2021 + 2024 update",year:2024,access:"Open",url:"https://www.sccm.org/survivingsepsiscampaign/guidelines-and-resources/surviving-sepsis-campaign-adult-guidelines",keys:"Hour-1 bundle: lactate, blood cultures BEFORE abx, broad-spectrum within 1h, 30 mL/kg crystalloid for hypotension/lactate>=4, norepinephrine first-line for MAP<65 after fluids. Balanced crystalloids (SMART, BaSICS). De-escalate by 48-72h."},
      {name:"DHHS HIV ART 2024",year:2024,access:"Open",url:"https://clinicalinfo.hiv.gov/en/guidelines/hiv-clinical-guidelines-adult-and-adolescent-arv/whats-new",keys:"INSTI-based regimens first-line (bictegravir/TAF/FTC, dolutegravir/3TC/ABC). Long-acting cabotegravir/rilpivirine bimonthly for adherence. Earlier statin use per REPRIEVE (35% MACE reduction). Start ART regardless of CD4 count."},
      {name:"IDSA/ATS CAP 2019",year:2019,access:"Open",url:"https://www.idsociety.org/practice-guideline/community-acquired-pneumonia-cap-in-adults/",keys:"Eliminated HCAP. Assess MRSA/Pseudomonas risk individually. CURB-65 / ATS minor criteria for severity. Outpatient: amoxicillin OR doxycycline OR macrolide (if local resistance <25%). Inpatient: beta-lactam + macrolide OR fluoroquinolone."},
      {name:"IDSA/ATS HAP/VAP 2016",year:2016,access:"Paywalled",url:"https://academic.oup.com/cid/article/63/5/e61/2237650",keys:"7-day standard duration for most HAP/VAP. Procalcitonin can guide de-escalation. Empiric coverage: anti-pseudomonal beta-lactam + MRSA coverage if risk factors. Local antibiogram-driven."},
      {name:"AHA 2023 IE Update + Duke-ISCVID",year:2023,access:"Open",url:"https://www.ahajournals.org/doi/10.1161/CIR.0000000000001093",keys:"Healthcare-associated IE increasing. Modified Duke-ISCVID 2023 incorporates molecular diagnostics, FDG-PET. Empiric therapy: ceftriaxone + vancomycin. POET trial: IV-to-PO transition after stabilization (>=10d IV + clinical response)."},
      {name:"ATS/CDC/IDSA TB 2024",year:2024,access:"Open",url:"https://www.idsociety.org/practice-guideline/treatment-of-drug-susceptible-tb/",keys:"4-month rifapentine-moxifloxacin (Study 31) for drug-susceptible TB >=12 years. 6-month BPaLM (bedaquiline-pretomanid-linezolid-moxifloxacin) for RIF-resistant. LTBI: 3HP weekly x12w (preferred) or 4R."},
      {name:"IDSA/SHEA C. difficile 2021 + ACG 2024",year:2024,access:"Open",url:"https://www.idsociety.org/practice-guideline/clostridioides-difficile-2021-focused-update/",keys:"Fidaxomicin first-line over vancomycin (lower recurrence). Bezlotoxumab for high-risk recurrence prevention. FMT for >=2 recurrences. Avoid metronidazole except for fulminant CDI."},
      {name:"IDSA SSTI 2014 + 2024 updates",year:2024,access:"Open",url:"https://www.idsociety.org/practice-guideline/skin-and-soft-tissue-infections/",keys:"Stratify by purulent vs nonpurulent and severity. MRSA coverage if penetrating trauma, prior MRSA, severe SIRS. Necrotizing infections: surgical debridement + broad antibiotics + clindamycin (toxin suppression). Diabetic foot: extended courses + osteomyelitis evaluation."},
      {name:"IDSA 2010/2025 UTI",year:2025,access:"Open",url:"https://www.idsociety.org/practice-guideline/complicated-urinary-tract-infections/",keys:"Uncomplicated cystitis: nitrofurantoin or TMP-SMX or fosfomycin. Complicated UTI / pyelonephritis: 5-7d fluoroquinolone (FQ) or 7-10d non-FQ. Asymptomatic bacteriuria: only treat in pregnancy or pre-urological surgery."},
      {name:"IDSA Bacterial Meningitis 2004 (still standard)",year:2004,access:"Open",url:"https://academic.oup.com/cid/article/39/9/1267/402080",keys:"Empiric: vancomycin + ceftriaxone (add ampicillin if >50yo/immunocompromised for Listeria). Dexamethasone 0.15 mg/kg q6h for pneumococcal (van de Beek). LP after head CT if focal deficits, papilledema, or immunocompromise."},
      {name:"IDSA Lyme 2020",year:2020,access:"Open",url:"https://www.idsociety.org/practice-guideline/lyme-disease/",keys:"Doxycycline 10-14d for early erythema migrans. 14-28d for neurologic/cardiac/arthritis. Single-dose doxycycline post-tick bite if Ixodes tick + >36h attached + endemic area + <72h post-bite. No chronic Lyme syndrome."},
      {name:"ACIP Adult Immunizations 2025",year:2025,access:"Open",url:"https://www.cdc.gov/vaccines/acip/recommendations.html",keys:"RZV (recombinant zoster) for all adults >=50. RSV vaccine universally for >=75; risk-based for 60-74. Pneumococcal: PCV21/PCV20/PCV15 for all >=50 (lowered from 65). Annual influenza, COVID-19, Tdap once + Td q10y."},
      {name:"IDSA Febrile Neutropenia 2024 + ASCO",year:2024,access:"Open",url:"https://www.idsociety.org/practice-guideline/fever-and-neutropenia-in-adults-with-cancer/",keys:"MASCC score risk stratification. High-risk (AML, HSCT, prolonged neutropenia >=7d): IV antipseudomonal beta-lactam + +/- vancomycin if mucositis/catheter/SSTI. Outpatient FQ for low-risk. FQ prophylaxis for high-risk."},
      {name:"WHO/IDSA Travel Medicine + Malaria",year:2024,access:"Open",url:"https://www.cdc.gov/yellow-book/",keys:"Pre-travel risk assessment: destination, activities, comorbidities. Malaria chemoprophylaxis (atovaquone-proguanil, doxycycline, mefloquine, tafenoquine). Severe malaria: IV artesunate + clindamycin. Tafenoquine for P. vivax radical cure."},

  "Heme/Onc": {
    society: "ASH (American Society of Hematology)",
    guidelines: [
      {name:"ASH 2020 + 2024 VTE Treatment",year:2024,access:"Open",url:"https://www.hematology.org/education/clinicians/guidelines-and-quality-care/clinical-practice-guidelines/venous-thromboembolism-guidelines",keys:"DOACs first-line: apixaban or rivaroxaban (no lead-in heparin); dabigatran/edoxaban require lead-in. Cancer-associated VTE: DOACs noninferior to LMWH (CARAVAGGIO, HOKUSAI-CANCER) - watch GI bleed with edoxaban. Provoked: 3 mo. Unprovoked: indefinite if low bleed risk."},
      {name:"ASH HIT 2018",year:2018,access:"Open",url:"https://www.hematology.org/education/clinicians/guidelines-and-quality-care/clinical-practice-guidelines/heparin-induced-thrombocytopenia-guidelines",keys:"4Ts score initial. Stop ALL heparin (incl. flushes). Non-heparin anticoagulants: argatroban, bivalirudin, danaparoid, fondaparinux, DOAC (apixaban / rivaroxaban for stable). Avoid platelet transfusion unless bleeding."},
      {name:"ASH ITP 2019",year:2019,access:"Open",url:"https://ashpublications.org/bloodadvances/article/3/23/3829/428701",keys:"Steroids first-line (dexamethasone 40mg x4d preferred over prednisone). Second-line: TPO-RAs (eltrombopag, romiplostim, avatrombopag), rituximab, splenectomy. IVIG for emergent platelet rise. Fostamatinib for refractory."},
      {name:"ASH Sickle Cell 2020 + 2024",year:2024,access:"Open",url:"https://www.hematology.org/education/clinicians/guidelines-and-quality-care/clinical-practice-guidelines/sickle-cell-disease-guidelines",keys:"Hydroxyurea standard; transfusion for stroke prevention (STOP). Voxelotor withdrawn 2024 (mortality signal); crizanlizumab disappointed in STAND. Gene therapy approved (exa-cel/CRISPR, lovo-cel) for severe SCD. Pain management with multimodal."},
      {name:"ASH TTP 2020 + HERCULES Trial",year:2020,access:"Open",url:"https://www.hematology.org/education/clinicians/guidelines-and-quality-care/clinical-practice-guidelines/thrombotic-microangiopathies-guidelines",keys:"Plasma exchange + caplacizumab (vWF nanobody) reduces death/recurrence/thrombosis 38%->8% (HERCULES). Steroids + rituximab for autoimmune iTTP. ADAMTS13 testing at presentation. PLASMIC score."},
      {name:"ACR/EULAR APS 2023",year:2023,access:"Open",url:"https://pubmed.ncbi.nlm.nih.gov/37635643/",keys:"New criteria 99% specificity. Persistent aPL (LA, aCL, anti-beta2GPI) >=12 weeks apart + clinical event. Triple-positive highest risk. Treatment: warfarin INR 2-3 (DOACs inferior per TRAPS in triple-positive); aspirin for primary prevention in obstetric APS."},
      {name:"AABB Transfusion Threshold 2023",year:2023,access:"Open",url:"https://jamanetwork.com/journals/jama/fullarticle/2810754",keys:"Restrictive: Hgb 7 g/dL for stable hospitalized adults (TRICC). Cardiac surgery: 7.5 g/dL. Orthopedic: 8 g/dL. Hem/onc: consider <7. Liberal in ACS uncertain (REALITY). Reduces transfusion volumes ~40%."},

  "Oncology": {
    society: "ASCO, NCCN, USPSTF",
    guidelines: [
      {name:"NCCN NSCLC v4.2024",year:2024,access:"Paywalled",url:"https://www.nccn.org/guidelines/guidelines-detail?category=1&id=1450",keys:"All advanced NSCLC: NGS for EGFR/ALK/ROS1/BRAF/KRAS-G12C/MET/RET/NTRK/HER2 + PD-L1 IHC. EGFR mut: osimertinib (FLAURA). ALK: alectinib/lorlatinib. KRAS-G12C: sotorasib/adagrasib (CodeBreaK 200). Adjuvant osimertinib (ADAURA), durvalumab (PACIFIC) post-CRT."},
      {name:"NCCN Breast Cancer v3.2024 + ASCO",year:2024,access:"Paywalled",url:"https://www.nccn.org/guidelines/guidelines-detail?category=1&id=1419",keys:"HER2+: trastuzumab + pertuzumab + taxane (CLEOPATRA); T-DXd second-line (DESTINY-Breast03). HR+: CDK4/6 inhibitors + AI/fulvestrant (PALOMA, MONALEESA, MONARCH); ribociclib OS benefit. TNBC: pembrolizumab + chemo (KEYNOTE-522). HER2-low: T-DXd."},
      {name:"NCCN Colorectal v2.2026",year:2026,access:"Paywalled",url:"https://www.nccn.org/guidelines/guidelines-detail?category=1&id=1438",keys:"Universal MMR/MSI testing. dMMR/MSI-H metastatic: pembrolizumab first-line (KEYNOTE-177; ORR ~30%, OS not reached). BRAF V600E: encorafenib + cetuximab/panitumumab (BEACON). Adjuvant FOLFOX/CAPOX +/- atezolizumab for stage III dMMR."},
      {name:"NCCN Prostate v5.2026",year:2026,access:"Paywalled",url:"https://www.nccn.org/guidelines/guidelines-detail?category=1&id=1444",keys:"Localized: surgery / radiation +/- ADT. Metastatic hormone-sensitive: ADT + docetaxel (CHAARTED) OR androgen receptor targeted (abiraterone/enzalutamide/apalutamide; LATITUDE/STAMPEDE/TITAN/ARCHES). CRPC: olaparib (BRCA, PROfound). PARPi for HRR mutations."},
      {name:"NCCN Multiple Myeloma v4.2026",year:2026,access:"Paywalled",url:"https://www.nccn.org/guidelines/",keys:"IMWG diagnosis: clonal plasma cells >=10% + myeloma-defining events (CRAB, biomarker SLiM-CRAB). Triplet/quadruplet induction (VRd, Dara-VRd; GRIFFIN, PERSEUS); ASCT eligibility-based. CAR-T (cilta-cel, ide-cel) for relapsed (CARTITUDE, KarMMa)."},
      {name:"USPSTF Cancer Screening 2024",year:2024,access:"Open",url:"https://www.uspreventiveservicestaskforce.org/uspstf/recommendation-topics/uspstf-a-and-b-recommendations",keys:"Breast: mammography 40-74 q2y (B). Colon: 45-75 (B 45-49, A 50-75). Lung LDCT: 50-80, >=20 pack-yr, current/former (quit <15y). Cervical: HPV primary q5y 30-65 or co-test. Prostate: shared decision 55-69."},
      {name:"ASCO Immunotherapy Toxicity 2024",year:2024,access:"Open",url:"https://ascopubs.org/doi/abs/10.1200/JCO.21.01440",keys:"Grade 1: continue, monitor. Grade 2: hold + consider steroids if persistent. Grade 3: hold + high-dose steroids (prednisone 1-2 mg/kg, taper 4-6 weeks). Grade 4: permanent discontinuation; immunosuppression escalation. Endocrinopathies often need lifelong replacement."},
      {name:"Cairo-Bishop TLS Definition",year:2004,access:"Open",url:"https://onlinelibrary.wiley.com/doi/10.1111/j.1365-2141.2004.05094.x",keys:"TLS: laboratory (>=2 of K, P, uric acid, Ca within +/-25% baseline) + clinical (Cr 1.5x, arrhythmia, seizure). High risk: bulky lymphoma, AML with hyperleukocytosis, ATL. Rasburicase for high-risk; allopurinol for moderate. Aggressive IV hydration."},
      {name:"ASCO Cancer Pain 2024",year:2024,access:"Open",url:"https://ascopubs.org/journal/jco",keys:"Multimodal pain management. Opioid titration with breakthrough doses. Adjuvants: gabapentinoids for neuropathic, dexamethasone for bone. Buprenorphine emerging for chronic cancer pain. Methadone caution (QT, drug interactions)."},

  "Rheumatology": {
    society: "ACR (American College of Rheumatology), EULAR",
    guidelines: [
      {name:"ACR Gout 2020",year:2020,access:"Open",url:"https://www.healio.com/clinical-guidance/gout/2020-american-college-of-rheumatology-guidelines-for-the-management-of-gout-treatment-guidelines",keys:"Treat-to-target uric acid <6 mg/dL (or <5 if tophi). Allopurinol first-line, start during flare with anti-inflammatory prophylaxis (3-6 mo). HLA-B*5801 screen in Asian populations (SCAR risk). Acute: NSAID, colchicine, OR steroid (combine for severe). Febuxostat caution per CARES (CV mortality)."},
      {name:"ACR RA 2021",year:2021,access:"Open",url:"https://pubmed.ncbi.nlm.nih.gov/34101376/",keys:"MTX monotherapy first-line (preferred over biologics in DMARD-naive). If inadequate response: add bDMARD (anti-TNF, anti-IL6, abatacept) OR JAKi (caution >65/CV risk per ORAL Surveillance). Triple therapy (MTX/HCQ/SSZ) acceptable alternative to biologics."},
      {name:"EULAR SLE 2023",year:2023,access:"Open",url:"https://ard.eular.org/article/S0003-4967(24)66542-8/fulltext",keys:"Hydroxychloroquine for ALL SLE patients. Lupus nephritis: MMF + steroids; add belimumab (BLISS-LN) or voclosporin (AURORA-1) for high proteinuria. Anifrolumab (TULIP) for skin/joint disease. Goal: lupus-related damage prevention via low-dose steroids + tight DMARD control."},
      {name:"ACR ANCA Vasculitis 2021",year:2021,access:"Open",url:"https://vasculitisfoundation.org/wp-content/uploads/2024/01/2021-ACR-VF-Guideline-for-Management-of-ANCA-Associated-Vasculitis.pdf",keys:"Severe GPA/MPA induction: rituximab (RAVE) preferred over cyclophosphamide; reduced-dose steroids (PEXIVAS, NNT 11). Avacopan (C5a inhibitor) steroid-sparing (ADVOCATE). Maintenance: rituximab > AZA. Plasma exchange controversial post-PEXIVAS."},
      {name:"ACR GCA 2021",year:2021,access:"Open",url:"https://acrjournals.onlinelibrary.wiley.com/doi/10.1002/acr.24632",keys:"High-dose prednisone immediately for vision threat (1mg/kg or 1g IV pulse if vision loss). Add tocilizumab for newly-dx (GiACTA) - reduces relapse / steroid burden. Methotrexate alternative. Temporal artery biopsy + LV vascular imaging (PET, MRA). Monitor with ESR/CRP."},
      {name:"ACR/SAA/SPARTAN Axial SpA 2019",year:2019,access:"Open",url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC6764857/",keys:"Stable AS: NSAID first-line; failure -> TNFi (any) preferred over IL-17i. PsA-related: TNFi or IL-17i; IL-23i (guselkumab, risankizumab) emerging. Treat-to-target with disease activity measures (BASDAI, ASDAS)."},
      {name:"GRAPPA PsA 2022",year:2022,access:"Open",url:"https://psoriasis-hub.com/medical-information/updated-grappa-guidelines-the-good-care-campaign-for-psoriatic-arthritis",keys:"Domain-based: peripheral arthritis, axial, enthesitis, dactylitis, skin, nails. csDMARD (MTX/SSZ/LEF) vs bDMARD (TNFi, IL-17i, IL-23i, JAKi, abatacept) by domain. Treat-to-target. IL-17i (secukinumab, ixekizumab) - excellent skin + joint."},
      {name:"ACR/EULAR Sjögren 2023",year:2023,access:"Open",url:"https://www.eular.org/recommendations-management",keys:"Sicca symptoms: artificial tears, saliva substitutes, pilocarpine, cevimeline. Systemic: hydroxychloroquine first-line; immunosuppressants (MTX, AZA, MMF) for organ involvement. Rituximab/abatacept for refractory; CD4+/CD20+ targeted therapy emerging."},
      {name:"EULAR Systemic Sclerosis 2023",year:2023,access:"Open",url:"https://ard.eular.org/",keys:"Skin: MMF or MTX. SSc-ILD: MMF, nintedanib (SENSCIS), tocilizumab (focuSSced). PAH: ERA + PDE5i (AMBITION). Renal crisis: ACEi (DO NOT use in pre-crisis prevention). Raynaud: CCB + PDE5i."},
      {name:"ACR Osteoarthritis 2019",year:2019,access:"Open",url:"https://acrjournals.onlinelibrary.wiley.com/doi/10.1002/art.41142",keys:"Exercise + weight loss core. Topical NSAIDs strongly recommended for hand/knee OA. Oral NSAIDs > acetaminophen (limited efficacy). Intra-articular steroids for flares (3-4x/year max). Avoid glucosamine/chondroitin, PRP, stem cells (insufficient evidence). Joint replacement for end-stage."},

  "Neurology": {

    guidelines: [
      {name:"AHA/ASA Acute Ischemic Stroke 2019/2024",year:2024,access:"Open",url:"https://www.ahajournals.org/doi/10.1161/STR.0000000000000513",keys:"IV alteplase (0.9 mg/kg) OR tenecteplase (0.25 mg/kg) within 4.5h LKW (extended to 9h with penumbra imaging per WAKE-UP/EXTEND/AcT). Mechanical thrombectomy <=24h for LVO with favorable imaging (DAWN, DEFUSE 3). BP <185/110 for tPA, <180/105 post-tPA."},
      {name:"AHA/ASA Stroke Prevention 2021",year:2021,access:"Open",url:"https://pubmed.ncbi.nlm.nih.gov/34024117/",keys:"DAPT (aspirin + clopidogrel) <=21d for minor stroke/TIA (CHANCE/POINT, start <=24h). Ticagrelor + aspirin (THALES) alternative. Statin, ACEi/ARB. AF: DOAC. Carotid stenosis 70-99% symptomatic: CEA/CAS within 2 weeks."},
      {name:"AHA/ASA ICH 2022",year:2022,access:"Open",url:"https://www.ahajournals.org/doi/10.1161/STR.0000000000000407",keys:"BP control <140 within 1-2h (INTERACT2/ATACH-2). Reverse anticoagulation (4F-PCC, idarucizumab for dabigatran, andexanet for FXa). Avoid prophylactic steroids. Surgical evacuation for cerebellar ICH >3cm or hydrocephalus."},
      {name:"AAN/AES Status Epilepticus 2016 + 2024",year:2024,access:"Open",url:"https://www.aan.com/Guidelines/",keys:"First-line benzodiazepine: IM midazolam 10mg, IV lorazepam 4mg, or IV diazepam 10mg. Second-line: fosphenytoin 20 mg/kg, valproate 40 mg/kg, levetiracetam 60 mg/kg - equivalent (ESETT). Refractory: anesthetic infusion (midazolam/propofol/pentobarbital)."},
      {name:"AHS Migraine 2024",year:2024,access:"Paywalled",url:"https://headachejournal.onlinelibrary.wiley.com/doi/10.1111/head.14692",keys:"Acute: triptans (sumatriptan, eletriptan), gepants (rimegepant, ubrogepant), ditans (lasmiditan), NSAIDs. Preventive: CGRP mAbs (erenumab, fremanezumab, galcanezumab, eptinezumab) FIRST-LINE (no prior trial requirement); atogepant; topiramate, propranolol. Triptans cardiac contraindications."},

      {name:"APA PTSD 2023",year:2023,access:"Open",url:"https://www.apa.org/ptsd-guideline",keys:"First-line: trauma-focused CBT (CPT, PE, EMDR) + SSRI/SNRI (sertraline, paroxetine, venlafaxine FDA-approved). Prazosin for nightmares. Avoid benzos. MDMA-assisted therapy under FDA review (denied 2024 - additional evidence required)."},

  };
  for (var spec in kwMap) {
    var kws = kwMap[spec];
    for (var ki = 0; ki < kws.length; ki++) {
      if (t.indexOf(kws[ki]) >= 0 && matched.indexOf(spec) < 0) {
        matched.push(spec);
        break;
      }
    }
  }
  if (matched.length === 0) {
    // try category match from TOPICS structure
    for (var cat in TOPICS) {
      var subs = TOPICS[cat].topics;
      for (var sub in subs) {
        for (var ti = 0; ti < subs[sub].length; ti++) {
          if (subs[sub][ti] === topic) {
            var cleanCat = cat.replace(/★\s*/,"").replace(/\s*\(\d+%.*\)/,"").trim();
            if (cleanCat === "★ Nephrology" || cleanCat === "Nephrology" || cat.indexOf("Nephrology") >= 0) matched.push("Nephrology");
            else if (cat.indexOf("Cardiovascular") >= 0) matched.push("Cardiovascular");

            else if (cat.indexOf("Allergy") >= 0) matched.push("Allergy/Immuno");
            else if (cat.indexOf("Dermatology") >= 0) matched.push("Dermatology");
            else if (cat.indexOf("Psychiatry") >= 0) matched.push("Psychiatry");
            else if (cat.indexOf("Geriatric") >= 0) matched.push("Geriatrics");
            else if (cat.indexOf("Women") >= 0) matched.push("Women's Health");
            else if (cat.indexOf("Prevention") >= 0) matched.push("Prevention");
            else if (cat.indexOf("Critical Care") >= 0) matched.push("Critical Care");
            else if (cat.indexOf("Palliative") >= 0) matched.push("Palliative");
          }
        }
      }
    }
  }
  if (matched.length === 0) return null;
  var result = { specialties: matched, context: "", sources: [], trials: [], conferences: [] };
  for (var mi = 0; mi < matched.length; mi++) {
    var g = GUIDELINES[matched[mi]];
    if (!g) continue;
    result.context += "\n\n[" + g.society + " Guidelines]\n";
    for (var gi = 0; gi < g.guidelines.length; gi++) {
      var gl = g.guidelines[gi];
      result.context += "• " + gl.name + " (" + gl.year + ", " + gl.access + "): " + gl.keys + "\n";
      result.sources.push(gl.name + " (" + gl.year + ")");
    }
    result.trials = result.trials.concat(g.trials || []);
    result.conferences = result.conferences.concat(g.conferences || []);
  }
  return result;
}

// Parses [N] / [N,M] markers in talk text and renders them as clickable pills.
function renderCite(text, refs) {
  if (!text) return "";
  if (!refs || !refs.length) return esc(String(text));
  var s = String(text);
  var html = "";
  var lastIdx = 0;
  var re = /\[(\d+(?:\s*,\s*\d+)*)\]/g;
  var m;
  while ((m = re.exec(s)) !== null) {
    html += esc(s.slice(lastIdx, m.index));
    var ids = m[1].split(",").map(function(x){return x.trim()});
    for (var i = 0; i < ids.length; i++) {
      var id = ids[i];
      var found = false;
      for (var ri = 0; ri < refs.length; ri++) { if (String(refs[ri].id) === id) { found = true; break; } }
      if (found) {
        html += '<span class="cite" data-ref="' + id + '">' + id + '</span>';
      } else {
        html += '['+id+']';
      }
    }
    lastIdx = m.index + m[0].length;
  }
  html += esc(s.slice(lastIdx));
  return html;
}

function stripCitations(str) {
  if (typeof str !== "string") return str;
  return str
    .replace(/]*>/g, "")
    .replace(/<\/antml:cite>/g, "")
    .replace(/<cite[^>]*>/g, "")
    .replace(/<\/cite>/g, "")
    .replace(/\[\d+(?:[-,:]\d+)*\]/g, "")  // also strip bracket citations like [1] [2-3]
    .trim();
}

function deepCleanCitations(obj) {
  if (typeof obj === "string") return stripCitations(obj);
  if (Array.isArray(obj)) return obj.map(deepCleanCitations);
  if (obj && typeof obj === "object") {
    var out = {};
    for (var k in obj) out[k] = deepCleanCitations(obj[k]);
    return out;
  }
  return obj;
}

function fixJSON(raw) {
  // Strip web search citation tags that leak into output
  var t = raw.replace(/]*>/g,"").replace(/<\/antml:cite>/g,"").replace(/<cite[^>]*>/g,"").replace(/<\/cite>/g,"");
  t = t.replace(/```json/g,"").replace(/```/g,"").trim();
  try { return JSON.parse(t), t; } catch(e) {}
  if (!t.endsWith("}")) { var idx = t.lastIndexOf("}"); if (idx > 0) t = t.substring(0, idx + 1); }
  try { return JSON.parse(t), t; } catch(e) {}
  var tryPoints = [];
  for (var i = t.length - 1; i > t.length * 0.3; i--) {
    if (t[i]==="}"||t[i]==="]"||t[i]==='"') tryPoints.push(i);
  }
  for (var p = 0; p < tryPoints.length && p < 40; p++) {
    var attempt = t.substring(0, tryPoints[p] + 1).replace(/,\s*$/,"");
    var ob=(attempt.match(/{/g)||[]).length-(attempt.match(/}/g)||[]).length;
    var sb=(attempt.match(/\[/g)||[]).length-(attempt.match(/\]/g)||[]).length;
    for(var k=0;k<sb;k++) attempt+="]";
    for(var k2=0;k2<ob;k2++) attempt+="}";
    ob=(attempt.match(/{/g)||[]).length-(attempt.match(/}/g)||[]).length;
    for(var k3=0;k3<ob;k3++) attempt+="}";
    try { return JSON.parse(attempt), attempt; } catch(e2) {}
  }
  return t;
}

function autoLayout(nodes,arrows){
  var inc={};for(var i=0;i<arrows.length;i++)inc[arrows[i].to]=true;
  var root=null;
  for(var i2=0;i2<nodes.length;i2++){if(nodes[i2].type==="title"){root=nodes[i2].id;break}}
  if(!root){for(var i3=0;i3<nodes.length;i3++){if(!inc[nodes[i3].id]){root=nodes[i3].id;break}}}
  if(!root)root=nodes[0].id;
  var ch={};for(var i4=0;i4<nodes.length;i4++)ch[nodes[i4].id]=[];
  for(var i5=0;i5<arrows.length;i5++){if(ch[arrows[i5].from])ch[arrows[i5].from].push(arrows[i5].to)}
  var layers={},vis={},q=[{id:root,layer:0}];vis[root]=true;

  var tl=Object.keys(layers).length;
  var lk=Object.keys(layers).sort(function(a,b){return parseInt(a)-parseInt(b)});

    if (useProxy && r.status === 403) throw new Error("Demo proxy denied this origin. Open the deployed site or use your own API key.");
    if(!useProxy && (r.status===401||r.status===403)){localStorage.removeItem("claude_api_key");throw new Error("Invalid API key (cleared). Click 'Set key' to re-enter.")}

// Try a list of models in order; fall through to the next on overload/server errors only.
// Returns {txt, modelUsed} so the UI can show which model produced the result.
async function callAPIWithFallback(sys, content, maxTok, models, opts) {
  opts = opts || {};
  var lastError;
  for (var i = 0; i < models.length; i++) {
    try {
      var modelOpts = Object.assign({}, opts, {model: models[i]});
      var txt = await callAPI(sys, content, maxTok, modelOpts);
      return {txt: txt, modelUsed: models[i], fellBack: i > 0};
    } catch (e) {
      lastError = e;
      // Only fall back on transient overload / server errors. Don't fall back on auth/key/rate-limit.
      var msg = String(e.message || "");
      var isOverload = /overloaded|server error|timed out|^API 5\d\d/i.test(msg);
      if (!isOverload || i === models.length - 1) throw e;
      console.warn("Model " + models[i] + " unavailable, falling back to " + models[i+1] + ": " + msg);
    }
  }
  throw lastError || new Error("All model fallbacks failed");
}

async function generate(){

  loadTimer=setInterval(function(){S.loadSec++;var msgs=S.wantWebSearch?["Reasoning through physiology...","Searching current literature...","Cross-referencing societies...","Building content...","Peer reviewing...","Polishing final version..."]:["Reasoning through physiology...","Loading guidelines...","Building content...","Peer reviewing & polishing..."];S.loadMsg=msgs[Math.min(Math.floor(S.loadSec/3),msgs.length-1)];render()},1000);
  try{
    var glRef = getGuidelinesForTopic(S.topic);
    var guidelineContext = "";
    if (glRef) {
      guidelineContext = "\n\n═══ GUIDELINE REFERENCE CONTEXT (use this to anchor your recommendations) ═══" + glRef.context;
      if (glRef.trials.length > 0) guidelineContext += "\nLandmark trials to cite when relevant: " + glRef.trials.join(", ");

      : '\nRely on your training and the GUIDELINE REFERENCE CONTEXT above. Do not search the web.';
    var depthHint = S.depth === 'concise'
      ? '\n\nDEPTH: CONCISE (~5-min summary). Keep this TIGHT. Same overall structure, but cut depth ~50%.\n- Each section: 3-4 BRIEF bullets (<=15 words each), not 5-7 long ones\n- Subtitle: <=10 words\n- Teaching pearl: 1 sentence, <=20 words\n- Board tip: 1 sentence, <=15 words\n- Visual memory card quadrants: <=8 words each, center: <=6 words\n- Summary points: <=20 words each, max 4 points\n- For boards style: vignette <=80 words, explanation 3-5 sentences, wrong explanations 1 sentence each, 3-4 board pearls (not 5), 3 teaching points <=20 words each.\nNO redundancy. No flowery language. Every word earns its place. Aim for clarity, not comprehensiveness.'
      : '\n\nDEPTH: DETAILED (full 10-min talk). Go deep. 5-7 substantive bullets per section exploring mechanism, evidence, clinical application. Teaching pearls and board tips can be 1-2 sentences with nuance. Aim for the full 10-min chalk talk experience.';
    var uc=[{type:"text",text:'Create content on: "'+S.topic+'"' + guidelineContext + depthHint + searchHint + '\nONLY JSON. Plain text values, no XML tags, no citation markup.'}];
    var sys=S.style==="boards"?BOARDS_PROMPT:LECTURE_PROMPT;

    // Step 1: Main generation with model fallback chain (Opus -> Sonnet -> Haiku)
    var mainOpts = {};

    var mainModels = [MODEL_MAIN, MODEL_SONNET_FALLBACK, MODEL_CRITIC];

    if(!txt.trim())throw new Error("Empty response");
    var draftTalk=JSON.parse(fixJSON(txt));

    // Step 2: Combined critique-and-fix in a single Haiku call

    var critiqueSystem = "You are a senior board-certified Internal Medicine attending acting as a peer reviewer for a chalk talk. Review for: (1) factual errors in physiology or pharmacology, (2) outdated treatment recommendations vs current major society guidelines (KDIGO/AHA/ACC/ATS/ACG/AASLD/ADA/IDSA/ASH/ASCO/ACR/AAN/SCCM/AAAAI/AAD/APA/AGS/ACOG/USPSTF/AAHPM), (3) internal contradictions, (4) wrong landmark trial attributions, (5) shallow physiology. Do NOT flag stylistic preferences.\n\nBOARDS-MODE ANSWER VERIFICATION (when the input contains a 'question' field): EXPLICITLY re-derive the correct answer. (a) Restate the discriminating clinical features in the stem. (b) Identify the most relevant guideline and year (KDIGO, AHA/ACC, ADA, etc.) or landmark trial. (c) Confirm whether the marked correct_letter is truly best per that guideline. (d) If a different choice is better, fix correct_letter and rewrite explanation + wrong_explanations accordingly. Do not allow ambiguous or 'defensibly correct' answers to stand \u2014 the correct answer must be UNAMBIGUOUSLY best per current guidelines.\n\nSTEM STYLE VERIFICATION (boards mode): Also verify the stem follows UWorld / ABIM style. Check: (a) demographic + presentation opener (A [age]-year-old [man/woman] comes to the physician...), (b) quantitative symptom detail (frequency, duration, character, location, timing), (c) explicit pertinent positives AND key pertinent negatives stated together, (d) social/medical history quantified where relevant (e.g., 8-10 beers/week, 1 pack/day for 30 years), (e) specific vital signs with numbers and lab values with units, (f) imaging or diagnostic findings stated specifically, (g) ending phrase: Which of the following is the most likely [diagnosis/next step in management/initial test/cause/treatment]?, (h) 5 choices, parallel grammatical structure (all diagnoses OR all treatments OR all tests, not mixed), (i) each choice 2-8 words, no 'all of the above', no 'none of the above', no vague catch-alls, (j) distractors are plausible alternatives a less-prepared resident might pick \u2014 not throwaway. If the stem fails ANY criterion, REWRITE the stem and choices to match UWorld style while preserving the same correct answer and clinical scenario. Do not change the medical content; tighten the format.\n\nReturn ONLY ONE of these two JSON formats (no other text):\n\nIF the talk is accurate and needs no changes:\n{\"verdict\":\"clean\"}\n\nIF you find substantive accuracy issues, return the FULL corrected chalk talk in the EXACT same JSON schema as the draft, with all your fixes applied. Do NOT include a verdict field in this case — just return the corrected talk JSON directly.";
    var critiqueInput = "Topic: " + S.topic + "\n\nDraft chalk talk to review:\n" + JSON.stringify(draftTalk);

    var finalTalk = draftTalk;
    try {
      // Boards-mode review prefers Opus (high-stakes accuracy); falls back to Sonnet then Haiku on overload.
      // Lecture-mode review just uses Haiku (sufficient for prose accuracy review).
      var criticModels = (S.style === "boards")

        var parsed = JSON.parse(fixJSON(critTxt));
        parsed = deepCleanCitations(parsed);

        if (parsed.verdict === "clean") {
          finalTalk = draftTalk;
        } else if (parsed.title || parsed.question) {
          // Looks like a corrected talk (has expected schema fields)
          finalTalk = parsed;
        }
      }
    } catch(critErr) {
      // If critique fails, fall back to original draft silently

    S.talk = finalTalk;
    S.sec=0;S.dg=null;S.dgErr="";S.podScript="";

function copyBoardsQuestion(){

  (q.choices||[]).forEach(function(ch){lines.push(ch.letter+". "+ch.text)});
  lines.push("");
  lines.push("Answer: "+(q.correct_letter||""));
  var text=lines.join("\n");

  }
}

// ═══════════ DIAGRAM SVG ═══════════
function diagSVG(dg){
  if(!dg||!dg.nodes||!dg.nodes.length)return"";
  var W=860,H=540,P=60,pos={};
  for(var i=0;i<dg.nodes.length;i++){
    var n=dg.nodes[i];
    var nx=Math.max(0,Math.min(1,n.x!=null?n.x:0.5));
    var ny=Math.max(0,Math.min(1,n.y!=null?n.y:0.5));
    pos[n.id]={px:P+nx*(W-P*2),py:P+ny*(H-P*2),label:n.label||"",type:n.type||"box"};
  }
  // Polished medical color palette
  var C={
    title:   {grad:["#4a1a7a","#702b9d"], s:"#ab82c5", t:"#fff",     z:16, w:2.5},
    accent:  {grad:["#5a2580","#8a3eb5"], s:"#c4a3da", t:"#fff",     z:13, w:2},
    formula: {grad:["#2a4a8a","#4a6db8"], s:"#9bb8e0", t:"#dde7f7",  z:13, w:2},
    warning: {grad:["#8a2828","#c84545"], s:"#e8a8a8", t:"#fff5f5",  z:13, w:2},
    box:     {grad:["#3a3450","#4d4666"], s:"#a09cb4", t:"#e8e6f0",  z:13, w:1.5}
  };
  var defs='<defs>';
  var types=Object.keys(C);
  for(var ti=0;ti<types.length;ti++){
    var ct=C[types[ti]];
    defs+='<linearGradient id="g_'+types[ti]+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+ct.grad[0]+'"/><stop offset="100%" stop-color="'+ct.grad[1]+'"/></linearGradient>';
  }
  defs+='<marker id="da" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto"><polygon points="0 0,12 4.5,0 9" fill="#c4a3da"/></marker>';
  defs+='<filter id="ds" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur in="SourceAlpha" stdDeviation="3"/><feOffset dx="0" dy="2" result="offsetblur"/><feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>';
  defs+='</defs>';
  var svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">'+defs;
  svg+='<rect width="'+W+'" height="'+H+'" fill="none"/>';
  // curved arrows
  var arrs=dg.arrows||[];
  for(var ai=0;ai<arrs.length;ai++){
    var a=arrs[ai],fr=pos[a.from],to=pos[a.to];
    if(!fr||!to)continue;
    var dx=to.px-fr.px, dy=to.py-fr.py, d=Math.sqrt(dx*dx+dy*dy);
    if(d<5)continue;
    var ux=dx/d, uy=dy/d;
    var startX=fr.px+ux*48, startY=fr.py+uy*30;
    var endX=to.px-ux*48, endY=to.py-uy*30;
    var midX=(startX+endX)/2, midY=(startY+endY)/2;
    var perpX=-uy, perpY=ux;
    var curveAmount=Math.min(d*0.15, 35);
    var c1x=startX+perpX*curveAmount*0.5, c1y=startY+perpY*curveAmount*0.5;
    var c2x=endX+perpX*curveAmount*0.5, c2y=endY+perpY*curveAmount*0.5;
    svg+='<path d="M '+startX+' '+startY+' C '+c1x+' '+c1y+' '+c2x+' '+c2y+' '+endX+' '+endY+'" stroke="rgba(196,163,218,0.7)" stroke-width="2.2" fill="none" marker-end="url(#da)"/>';
    if(a.label){
      var lx=midX+perpX*curveAmount*0.4, ly=midY+perpY*curveAmount*0.4;
      var lblW=a.label.length*7+14;
      svg+='<rect x="'+(lx-lblW/2)+'" y="'+(ly-11)+'" width="'+lblW+'" height="22" rx="11" fill="#2d2a3e" stroke="rgba(196,163,218,0.5)" stroke-width="1"/>';
      svg+='<text x="'+lx+'" y="'+(ly+4)+'" text-anchor="middle" fill="#d4baea" font-size="11" font-weight="500">'+esc(a.label)+'</text>';
    }
  }
  // nodes
  for(var ni=0;ni<dg.nodes.length;ni++){
    var nd=dg.nodes[ni], p=pos[nd.id], lb=p.label;
    var c=C[p.type]||C.box;
    var maxLen=nd.type==="title"?22:18;
    var ln=wrapText(lb,maxLen);
    var fontWeight=nd.type==="title"?700:nd.type==="accent"?600:550;
    var fontSize=c.z;
    var bw=Math.max(lb.length*(nd.type==="title"?9:7.2)+44, 110);
    var bh=(nd.type==="title"?52:42)+(ln.length-1)*19;
    var rx=nd.type==="title"?14:11;
    svg+='<g filter="url(#ds)">';
    svg+='<rect x="'+(p.px-bw/2)+'" y="'+(p.py-bh/2)+'" width="'+bw+'" height="'+bh+'" rx="'+rx+'" fill="url(#g_'+(C[p.type]?p.type:"box")+')" stroke="'+c.s+'" stroke-width="'+c.w+'"'+(nd.type==="formula"?' stroke-dasharray="6,3"':"")+'/>';
    for(var tl=0;tl<ln.length;tl++){
      var ty=p.py+5+tl*19-(ln.length-1)*9.5;
      svg+='<text x="'+p.px+'" y="'+ty+'" text-anchor="middle" fill="'+c.t+'" font-size="'+fontSize+'" font-weight="'+fontWeight+'" letter-spacing="0.2">'+esc(ln[tl])+'</text>';
    }
    svg+='</g>';
  }
  return svg+"</svg>";
}

    h+='</div>';
    h+='</div>';  // close vmcCard
    // References block (only shown if talk has references)
    if(t.references&&t.references.length){
      h+='<div style="background:#fff;border:1px solid #e8e6f0;border-radius:12px;padding:18px 20px;margin-bottom:16px"><div style="font-size:11px;font-weight:700;color:#9490a6;text-transform:uppercase;letter-spacing:0.09em;margin-bottom:12px">References</div><ol style="list-style:none;counter-reset:cite;padding:0;margin:0">';
      for(var rfi=0;rfi<t.references.length;rfi++){
        var rf=t.references[rfi];
        var meta=[];
        if(rf.year)meta.push(String(rf.year));
        if(rf.society)meta.push(esc(rf.society));
        if(rf.type==="trial")meta.push("trial");
        h+='<li style="counter-increment:cite;display:flex;gap:10px;font-size:12.5px;line-height:1.5;color:#4a4660;margin-bottom:8px;padding-bottom:8px;border-bottom:1px dashed #e8e6f0"><span style="background:#eee6f3;color:#702b9d;border:1px solid #d4baea;border-radius:4px;padding:0 6px;font-size:10.5px;font-weight:600;flex-shrink:0;height:fit-content;margin-top:1px">'+esc(String(rf.id))+'</span><span style="flex:1"><strong style="color:#330662">'+esc(rf.source||("Reference "+rf.id))+'</strong>'+(meta.length?' <span style="font-size:11px;color:#9490a6">\u00B7 '+meta.join(" \u00B7 ")+'</span>':'')+(rf.url?'<br><a href="'+esc(rf.url)+'" target="_blank" rel="noopener" style="color:#702b9d;text-decoration:none;font-size:11.5px;border-bottom:1px solid #d4baea">'+esc(rf.url.length>60?rf.url.slice(0,60)+"...":rf.url)+'</a>':'')+'</span></li>';
      }
      h+='</ol></div>';
    }
    h+='</div>';
  }

  // ═══ FOOTER ═══
  h+='<div style="margin-top:48px;padding:24px 8px 8px;border-top:1px solid #e8e6f0;text-align:center;font-size:11px;color:#9490a6;line-height:1.7;letter-spacing:0.01em">';
  h+='<div style="font-size:10px;text-transform:uppercase;letter-spacing:0.12em;color:#b0aac0;margin-bottom:8px;font-weight:600">A teaching tool · Free for educational use</div>';
  h+='<div style="font-size:11.5px;color:#6b6780">© 2026 <a href="https://www.linkedin.com/in/tangjennii/" target="_blank" style="color:#702b9d;text-decoration:none;font-weight:600;border-bottom:1px solid rgba(112,43,157,0.25);padding-bottom:1px">Jennifer Tang, MD</a> · Internal Medicine · Nephrology</div>';
  h+='<div style="margin-top:4px;font-size:10.5px;color:#a8a3b8">Licensed under <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank" style="color:#9490a6;text-decoration:none;border-bottom:1px dotted #c4c0d0">CC BY-NC-SA 4.0</a></div>';
  h+='</div>';

  return h;
}

// ═══════════ BIND ═══════════
function bindLib(){
  document.getElementById("libBack").onclick=function(){S.showLib=false;render()};
  document.getElementById("libSearch").oninput=function(e){S.search=e.target.value;render()};
  document.querySelectorAll(".catBtn").forEach(function(b){b.onclick=function(){S.expCat=S.expCat===b.dataset.cat?null:b.dataset.cat;S.expSub=null;render()}});
  document.querySelectorAll(".subBtn").forEach(function(b){b.onclick=function(){S.expSub=S.expSub===b.dataset.sub?null:b.dataset.sub;render()}});
  document.querySelectorAll(".topBtn").forEach(function(b){b.onclick=function(){S.topic=b.dataset.t;S.showLib=false;render()}});
}

function bindMain(){
  var ta=document.getElementById("topicTA");if(ta)ta.oninput=function(e){S.topic=e.target.value;var gb2=document.getElementById("genBtn");if(gb2){gb2.disabled=S.loading||!S.topic.trim();gb2.style.opacity=S.loading||!S.topic.trim()?"0.4":"1"}};
  var bb=document.getElementById("browseBtn");if(bb)bb.onclick=function(){S.showLib=true;S.expCat=null;render()};
  var ci=document.getElementById("chatInput");if(ci){ci.oninput=function(e){S.chatIn=e.target.value;var csB=document.getElementById("chatSend");if(csB){var act=!S.chatBusy&&S.chatIn.trim();csB.style.background=act?"linear-gradient(135deg,#702b9d,#330662)":"#c9c3d6";csB.style.boxShadow=act?"0 2px 10px rgba(112,43,157,0.45)":"none";csB.style.cursor=act?"pointer":"not-allowed"}};ci.onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();sendChat()}}}
  var cs=document.getElementById("chatSend");if(cs)cs.onclick=sendChat;
  document.querySelectorAll(".styleBtn").forEach(function(b){b.onclick=function(){if(S.style!==b.dataset.s){S.style=b.dataset.s;S.talk=null;S.sec=0;S.dg=null;S.dgErr="";S.podScript="";S.podPlaying=false;S.podShow=false;S.showAns=false;S.userPick="";S.error="";speechSynthesis.cancel()}render()}});
  document.querySelectorAll(".depthBtn").forEach(function(b){b.onclick=function(){if(S.depth!==b.dataset.d){S.depth=b.dataset.d;S.talk=null;S.sec=0;S.dg=null;S.dgErr="";S.podScript="";S.podPlaying=false;S.podShow=false;S.showAns=false;S.userPick="";S.error="";speechSynthesis.cancel()}render()}});
  var dz=document.getElementById("dropZone");if(dz)dz.onclick=function(){document.getElementById("fileInput").click()};
  var fi=document.getElementById("fileInput");if(fi)fi.onchange=async function(e){
    for(var i=0;i<e.target.files.length;i++){var f=e.target.files[i];try{
      if(f.type.indexOf("text")>=0||f.name.endsWith(".txt")){var r=new FileReader();r.onload=function(){S.files.push({n:f.name,t:"text",c:r.result.slice(0,8000)});render()};r.readAsText(f)}
      else if(f.type==="application/pdf"||f.type.indexOf("image/")===0){var r2=new FileReader();r2.onload=function(){S.files.push({n:f.name,t:f.type==="application/pdf"?"pdf":"img",c:r2.result.split(",")[1],m:f.type});render()};r2.readAsDataURL(f)}
    }catch(err){}}};
  document.querySelectorAll(".rmFile").forEach(function(b){b.onclick=function(){S.files.splice(+b.dataset.i,1);render()}});
  var pc=document.getElementById("podCheck");if(pc)pc.onchange=function(e){S.wantPod=e.target.checked};
  var wc=document.getElementById("webCheck");if(wc)wc.onchange=function(e){S.wantWebSearch=e.target.checked};
  var gb=document.getElementById("genBtn");if(gb)gb.onclick=generate;
  var rb=document.getElementById("resetBtn");if(rb)rb.onclick=resetAll;
  document.querySelectorAll(".secBtn").forEach(function(b){b.onclick=function(){S.sec=+b.dataset.i;render()}});
  var db=document.getElementById("dgBtn");if(db)db.onclick=genDiagram;
  document.querySelectorAll(".dgModeBtn").forEach(function(b){b.onclick=function(){if(S.dgMode!==b.dataset.m){S.dgMode=b.dataset.m;S.dg=null;S.dgErr="";render()}}});
  var rk=document.getElementById("resetKey");if(rk)rk.onclick=function(e){e.preventDefault();localStorage.removeItem("gemini_api_key");S.dgErr="API key cleared. Click Generate Visual to re-enter.";render()};
  var rck=document.getElementById("resetClaudeKey");if(rck)rck.onclick=function(){localStorage.removeItem("claude_api_key");var nk=prompt("Enter your Anthropic API key:\n\nGet one at: https://console.anthropic.com/settings/keys");if(nk&&nk.trim())localStorage.setItem("claude_api_key",nk.trim());render()};
  document.querySelectorAll(".choiceBtn").forEach(function(b){b.onclick=function(){if(!S.showAns){S.userPick=b.dataset.letter;render()}}});
  var sb=document.getElementById("submitAnsBtn");if(sb)sb.onclick=function(){S.showAns=true;render()};
  var ft=document.getElementById("feedbackToggle");if(ft)ft.onclick=function(){S.showFeedback=true;render()};
  var fta=document.getElementById("feedbackTA");if(fta)fta.oninput=function(e){S.feedbackText=e.target.value;var fsb=document.getElementById("feedbackSubmit");if(fsb)fsb.style.opacity=S.feedbackText.trim()?"1":"0.4"};
  var fs=document.getElementById("feedbackSubmit");if(fs)fs.onclick=submitFeedback;
  var fc=document.getElementById("feedbackCancel");if(fc)fc.onclick=function(){S.showFeedback=false;S.feedbackText="";render()};
  var pg=document.getElementById("podGenBtn");if(pg)pg.onclick=genPodcast;
  var pp=document.getElementById("podPlayBtn");if(pp)pp.onclick=playPod;
  document.querySelectorAll(".rateBtn").forEach(function(b){b.onclick=function(){S.podRate=parseFloat(b.dataset.r);if(S.podPlaying){speechSynthesis.cancel();S.podPlaying=false}render()}});
  var pt=document.getElementById("podToggle");if(pt)pt.onclick=function(){S.podShow=!S.podShow;render()};
  var mlb=document.getElementById("myLibBtn");if(mlb)mlb.onclick=function(){S.showSaved=true;S.savedSearch="";render()};
  var exb=document.getElementById("examplesBtn");if(exb)exb.onclick=function(){S.showExamples=true;render()};
  document.querySelectorAll(".landingSampleBtn").forEach(function(b){b.onclick=function(){loadSample(b.dataset.slug)}});
  var dvb=document.getElementById("downloadVMCBtn");if(dvb)dvb.onclick=downloadVMC;
  var cqb=document.getElementById("copyQBtn");if(cqb)cqb.onclick=copyBoardsQuestion;
  var lmb=document.getElementById("landingMoreBtn");if(lmb)lmb.onclick=function(){S.showExamples=true;render()};
  var mtb=document.getElementById("modeToggleBtn");if(mtb)mtb.onclick=function(){
    if(!PROXY_CONFIG.enabled||!PROXY_CONFIG.url){alert("Demo proxy isn\'t configured for this build. Stay on your own key.");return}
    S.useByok=!S.useByok;render();
  };
  var stb=document.getElementById("saveTalkBtn");if(stb)stb.onclick=saveCurrentTalk;
  var ptb=document.getElementById("pdfTalkBtn");if(ptb)ptb.onclick=exportTalkPDF;
  var jtb=document.getElementById("jsonTalkBtn");if(jtb)jtb.onclick=function(){exportTalkJSON(null)};
  var shr=document.getElementById("shareTalkBtn");if(shr)shr.onclick=function(){shareTalk()};
}

// ═══════════ INIT ═══════════
loadFromShareHash();
render();
</script>
